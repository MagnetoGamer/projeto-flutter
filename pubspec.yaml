name: projeto_flutter
description: Projeto Flutter com arquitetura Hexagonal
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # Roteamento
  go_router: ^13.0.0
  
  # Gerenciamento de estado
  provider: ^6.1.1
  
  # Injeção de dependências
  get_it: ^7.6.4
  
  # HTTP
  http: ^1.1.0
  
  # Armazenamento local
  shared_preferences: ^2.2.2
  
  # Utilitários
  equatable: ^2.0.5
  dartz: ^0.10.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

